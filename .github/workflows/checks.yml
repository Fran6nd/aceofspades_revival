name: Checks

# Test suite for the cross-platform Python sources.
#
# Unlike packaging, these tests already run on all three platforms: nothing in
# tests/ imports the Windows-only native modules or pyglet, and the frontend
# tests parse and exec individual methods rather than importing their modules.
# Running them on macOS and Linux is the regression guard that keeps the
# portable Python layer portable while the native module port proceeds.

# Runs on every branch, not just master. The suite is fast and cheap, so there
# is no reason to wait for a pull request to find out something broke.
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3.8 is the floor (the tests build ast.Module with type_ignores and use
      # ast.Constant). 3.12 matches the release builder's interpreter.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # launcher.py imports tkinter at module scope, and two test files import
      # launcher. Without tkinter both fail at collection and pytest aborts the
      # entire run rather than skipping them, so check it explicitly to get a
      # clear failure instead of a confusing one. No display is needed: every
      # Tk() call sits inside a function body.
      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run tests
        id: pytest-windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m pytest tests/ -v --junitxml=test-results.xml

      # Two tests assert Windows path semantics (a drive-letter path resolved
      # through os.path.abspath) and cannot hold where os.path is posixpath.
      # They are deselected rather than skipped so their absence is visible
      # here and they still run on the Windows leg above.
      - name: Run tests
        id: pytest-posix
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --junitxml=test-results.xml \
            --deselect tests/test_unicode_appdata_paths.py::test_frozen_updater_uses_wide_executable_path \
            --deselect tests/test_unicode_appdata_paths.py::test_frozen_launcher_uses_wide_executable_path

      # Run logs need an authenticated request, but annotations do not. Turning
      # failures into annotations keeps a red build diagnosable from the API.
      - name: Annotate failures
        if: always()
        run: python tools/ci/annotate_junit.py test-results.xml

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if tests failed
        if: steps.pytest-windows.outcome == 'failure' || steps.pytest-posix.outcome == 'failure'
        run: exit 1
