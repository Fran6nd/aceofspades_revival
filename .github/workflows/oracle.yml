name: Oracle

# Captures the public API of the Windows-only native modules.
#
# The shipped .pyd files are 32-bit Python 2.7 extensions, so real Windows is
# the only place they can be loaded. This job loads them there and publishes
# the result as an artifact. The port work then happens natively on macOS and
# Linux against that artifact, with no Windows in the loop.
#
# It never fails on a module that cannot be imported: which modules refuse to
# load on a runner with no GPU and no display is exactly the thing this job
# exists to find out.

on:
  push:
  workflow_dispatch:

env:
  PY2_VERSION: '2.7.18'
  PY2_DIR: 'C:\Python27-x86'

jobs:
  introspect:
    name: Introspect native modules
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Python 3 for the reporting helpers below. Unrelated to the 32-bit
      # Python 2.7 that actually loads the modules.
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python 2.7 installer
        id: cache-py2-installer
        uses: actions/cache@v4
        with:
          path: python2-installer
          key: py2-installer-${{ env.PY2_VERSION }}-x86

      - name: Download Python 2.7 (32-bit)
        if: steps.cache-py2-installer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python2-installer | Out-Null
          $url = "https://www.python.org/ftp/python/$env:PY2_VERSION/python-$env:PY2_VERSION.msi"
          Invoke-WebRequest -Uri $url -OutFile python2-installer\python2.msi

      - name: Install Python 2.7 (32-bit)
        shell: pwsh
        run: |
          $msi = (Resolve-Path python2-installer\python2.msi).Path
          Start-Process msiexec.exe -Wait -ArgumentList @(
            '/i', "`"$msi`"", '/qn', "TARGETDIR=$env:PY2_DIR", 'ALLUSERS=1'
          )
          $bits = & "$env:PY2_DIR\python.exe" -c "import struct; print(struct.calcsize('P') * 8)"
          if ($bits.Trim() -ne '32') {
            throw "Expected a 32-bit Python 2.7 runtime, got $bits-bit."
          }

      - name: Install pip for Python 2.7
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/pip/2.7/get-pip.py -OutFile get-pip.py
          & "$env:PY2_DIR\python.exe" get-pip.py
          Remove-Item get-pip.py

      # Several modules reference pyglet, and gamemanager also references
      # Twisted. Both need to be importable or those modules will fail for a
      # reason that has nothing to do with the runner being headless.
      - name: Install client runtime dependencies
        shell: pwsh
        env:
          PURE_PYTHON: '1'
        run: |
          & "$env:PY2_DIR\python.exe" -m pip install -r requirements.txt
          $target = "$env:PY2_DIR\Lib\site-packages\pyglet"
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Copy-Item -Recurse -Force vendor\pyglet $target

      # The harness is Python 2.7 source running under an interpreter that
      # cannot be exercised anywhere else, so capture its output: a syntax or
      # startup error produces no report and would otherwise be invisible.
      - name: Introspect native modules
        id: introspect
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:PY2_DIR\python.exe" tools\oracle\introspect_modules.py build\oracle\native_api.json > oracle-output.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content oracle-output.txt
          exit $code

      # Only on failure: the report is JSON, not JUnit, so this is purely the
      # raw-output path for a harness that died before producing anything.
      - name: Annotate harness failure
        if: steps.introspect.outcome == 'failure'
        shell: pwsh
        run: python tools\ci\annotate_junit.py build\oracle\native_api.json oracle-output.txt

      # Emits the per-module outcome as annotations, which are readable from
      # the API without a token, unlike the run log or the artifact.
      - name: Summarise results
        if: always()
        run: python tools/ci/report_oracle.py build/oracle/native_api.json

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-api-report
          path: |
            build/oracle/native_api.json
            oracle-output.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if the harness did not run
        if: steps.introspect.outcome == 'failure'
        run: exit 1
